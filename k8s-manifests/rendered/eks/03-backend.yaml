# Canary pods are named <rollout>-<pod-template-hash>-<suffix>, so the hash isolates canary metrics.
apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: backend-success-rate
  labels:
    helm.sh/chart: backend-1.0.0
    app.kubernetes.io/name: backend-api
    app.kubernetes.io/instance: backend
    app.kubernetes.io/version: "1.0.0"
    app.kubernetes.io/component: api
    app.kubernetes.io/part-of: cloudforge
    app.kubernetes.io/managed-by: Helm
spec:
  args:
    - name: canary-hash
  metrics:
    - name: success-rate
      interval: 30s
      count: 4
      failureLimit: 1
      # NaN (no traffic yet) counts as success to avoid aborting idle canaries.
      successCondition: result[0] >= 0.99 || isNaN(result[0])
      provider:
        prometheus:
          address: http://kube-prometheus-stack-prometheus.monitoring.svc.cluster.local:9090
          query: |
            sum(rate(http_requests_total{namespace="backend",pod=~"backend-api-{{args.canary-hash}}-.*",status!~"5.."}[2m]))
            /
            sum(rate(http_requests_total{namespace="backend",pod=~"backend-api-{{args.canary-hash}}-.*"}[2m]))
    - name: p95-latency
      interval: 30s
      count: 4
      failureLimit: 1
      successCondition: result[0] <= 0.5 || isNaN(result[0])
      provider:
        prometheus:
          address: http://kube-prometheus-stack-prometheus.monitoring.svc.cluster.local:9090
          query: |
            histogram_quantile(0.95, sum by (le) (rate(http_request_duration_seconds_bucket{namespace="backend",pod=~"backend-api-{{args.canary-hash}}-.*"}[2m])))

