# In-mesh routing for callers of backend-api (the Apache tier). Argo Rollouts rewrites the
# weights on route 'primary' during a canary; outside a rollout stable=100 / canary=0.
apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: backend-api
  labels:
    helm.sh/chart: backend-1.0.0
    app.kubernetes.io/name: backend-api
    app.kubernetes.io/instance: backend
    app.kubernetes.io/version: "1.0.0"
    app.kubernetes.io/component: api
    app.kubernetes.io/part-of: cloudforge
    app.kubernetes.io/managed-by: Helm
spec:
  hosts:
    - backend-api
    - backend-api.backend.svc.cluster.local
  gateways: [mesh]
  http:
    - name: primary
      timeout: 15s
      retries:
        attempts: 2
        perTryTimeout: 5s
        retryOn: 5xx,reset,connect-failure,refused-stream
      route:
        - destination:
            host: backend-api.backend.svc.cluster.local
            subset: stable
            port: { number: 8000 }
          weight: 100
        - destination:
            host: backend-api.backend.svc.cluster.local
            subset: canary
            port: { number: 8000 }
          weight: 0
