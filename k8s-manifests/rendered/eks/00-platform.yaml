# Restrict sidecar config to what each namespace talks to (smaller Envoy config, faster pushes).
apiVersion: networking.istio.io/v1
kind: Sidecar
metadata:
  name: default
  namespace: frontend
  labels:
    helm.sh/chart: platform-1.0.0
    app.kubernetes.io/part-of: cloudforge
    app.kubernetes.io/component: platform
    app.kubernetes.io/managed-by: Helm
    cloudforge.dev/environment: dev
spec:
  egress:
    - hosts: ["./*", "backend/*", "istio-system/*"]

---
# Source: platform/templates/istio.yaml
apiVersion: networking.istio.io/v1
kind: Sidecar
metadata:
  name: default
  namespace: backend
  labels:
    helm.sh/chart: platform-1.0.0
    app.kubernetes.io/part-of: cloudforge
    app.kubernetes.io/component: platform
    app.kubernetes.io/managed-by: Helm
    cloudforge.dev/environment: dev
spec:
  egress:
    - hosts: ["./*", "database/*", "istio-system/*"]

---
# Source: platform/templates/istio.yaml
apiVersion: networking.istio.io/v1
kind: Sidecar
metadata:
  name: default
  namespace: database
  labels:
    helm.sh/chart: platform-1.0.0
    app.kubernetes.io/part-of: cloudforge
    app.kubernetes.io/component: platform
    app.kubernetes.io/managed-by: Helm
    cloudforge.dev/environment: dev
spec:
  egress:
    - hosts: ["./*", "istio-system/*"]
  outboundTrafficPolicy:
    mode: REGISTRY_ONLY

---
# Source: platform/templates/istio.yaml
apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: apache-proxy
  namespace: backend
  labels:
    helm.sh/chart: platform-1.0.0
    app.kubernetes.io/part-of: cloudforge
    app.kubernetes.io/component: platform
    app.kubernetes.io/managed-by: Helm
    cloudforge.dev/environment: dev
spec:
  hosts: [apache-proxy.backend.svc.cluster.local]
  gateways: [mesh]
  http:
    - name: api
      match: [{ uri: { prefix: /api/ } }]
      timeout: 20s
      retries: { attempts: 2, perTryTimeout: 8s, retryOn: "connect-failure,refused-stream,unavailable,503" }
      route:
        - destination: { host: apache-proxy.backend.svc.cluster.local, port: { number: 8080 } }

---
# Source: platform/templates/istio.yaml
apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: cloudforge-edge
  namespace: frontend
  labels:
    helm.sh/chart: platform-1.0.0
    app.kubernetes.io/part-of: cloudforge
    app.kubernetes.io/component: platform
    app.kubernetes.io/managed-by: Helm
    cloudforge.dev/environment: dev
spec:
  hosts:
    - mesh.cloudforge.example.com
  gateways: [istio-system/cloudforge-gateway]
  http:
    - name: web
      match: [{ uri: { prefix: / } }]
      headers:
        response:
          set:
            Strict-Transport-Security: "max-age=31536000; includeSubDomains"
      route:
        - destination:
            host: frontend.frontend.svc.cluster.local
            port: { number: 80 }
