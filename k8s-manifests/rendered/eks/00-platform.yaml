          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 6
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum by (product) (rate(cloudforge_orders_created_total[5m])) * 60",
              "legendFormat": "{{product}}",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              }
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "none",
              "custom": {
                "lineWidth": 1,
                "fillOpacity": 15,
                "stacking": {
                  "mode": "normal"
                },
                "showPoints": "never"
