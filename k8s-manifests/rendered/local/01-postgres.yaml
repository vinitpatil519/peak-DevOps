# Source: postgres/templates/backup-cronjob.yaml
apiVersion: batch/v1
kind: CronJob
metadata:
  name: postgres-backup
  labels:
    helm.sh/chart: postgres-1.0.0
    app.kubernetes.io/name: postgres
    app.kubernetes.io/instance: postgres
    app.kubernetes.io/version: "17.6-alpine"
    app.kubernetes.io/component: database
    app.kubernetes.io/part-of: cloudforge
    app.kubernetes.io/managed-by: Helm
spec:
  schedule: "0 2 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 1800
      template:
        metadata:
          labels: { app.kubernetes.io/name: postgres-backup }
          annotations:
            sidecar.istio.io/inject: "true"
            proxy.istio.io/config: '{ "holdApplicationUntilProxyStarts": true }'
        spec:
          serviceAccountName: postgres-backup
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 70
            runAsGroup: 70
            fsGroup: 70
            seccompProfile: { type: RuntimeDefault }
          containers:
            - name: pg-dump
              image: "postgres:17.6-alpine"
              env:
                - { name: PGHOST, value: postgres }
                - { name: PGUSER, value: "cloudforge" }
                - { name: PGDATABASE, value: "cloudforge" }
                - name: PGPASSWORD
                  valueFrom: { secretKeyRef: { name: postgres-credentials, key: password } }
                - { name: RETENTION_DAYS, value: "7" }
              command: ["/bin/sh", "-c"]
              args:
                - |
                  set -eu
                  trap 'wget -qO- --post-data="" http://127.0.0.1:15020/quitquitquit >/dev/null 2>&1 || true' EXIT
                  f="/backups/${PGDATABASE}-$(date -u +%Y%m%dT%H%M%SZ).dump"
                  pg_dump --format=custom --no-owner --file="$f"
                  pg_restore --list "$f" >/dev/null   # verify archive is readable
                  find /backups -name '*.dump' -mtime +"$RETENTION_DAYS" -delete
                  echo "backup ok: $f ($(du -h "$f" | cut -f1))"
              resources:
                requests: { cpu: 50m, memory: 64Mi }
                limits: { memory: 256Mi }
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                runAsNonRoot: true
                capabilities: { drop: [ALL] }
              volumeMounts:
                - { name: backups, mountPath: /backups }
          volumes:
            - name: backups
              persistentVolumeClaim: { claimName: postgres-backups }

