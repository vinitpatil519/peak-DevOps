# Reference only: the credential Secrets the charts expect (keys and namespaces).
# scripts/bootstrap-local.sh creates them with random values; on EKS the External Secrets
# Operator creates them from AWS Secrets Manager. NEVER commit real values.
apiVersion: v1
kind: Secret
metadata:
  name: postgres-credentials
  namespace: database
type: Opaque
stringData:
  password: "<generated>"
---
apiVersion: v1
kind: Secret
metadata:
  name: redis-credentials
  namespace: database
type: Opaque
stringData:
  password: "<generated>"
---
apiVersion: v1
kind: Secret
metadata:
  name: backend-credentials
  namespace: backend
type: Opaque
stringData:
  CF_DB_PASSWORD: "<same as postgres-credentials.password>"
  CF_REDIS_PASSWORD: "<same as redis-credentials.password>"
---
apiVersion: v1
kind: Secret
metadata:
  name: grafana-admin
  namespace: monitoring
type: Opaque
stringData:
  admin-user: admin
  admin-password: "<generated>"
