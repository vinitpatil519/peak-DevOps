# Prometheus config for the docker compose 'observability' profile.
global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    environment: docker-compose

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: cloudforge-api
    metrics_path: /metrics/
    static_configs:
      - targets: ["api:8000"]
        labels: { namespace: backend, service: backend-api }
