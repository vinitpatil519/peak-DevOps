---
# Full provisioning: workstation tools + CI host + cluster monitoring.
#   ansible-galaxy collection install -r requirements.yml
#   ansible-playbook playbooks/site.yml -K
- name: Workstation toolchain
  hosts: workstation
  become: true
  roles:
    - role: docker
      tags: [docker]
    - role: kubectl
      tags: [kubectl]
    - role: helm
      tags: [helm]

- name: CI server (Jenkins + SonarQube)
  hosts: ci
  become: true
  roles:
    - role: docker
      tags: [docker]
    - role: jenkins
      tags: [jenkins]

- name: Cluster monitoring stack
  hosts: workstation
  become: false
  roles:
    - role: monitoring
      tags: [monitoring]
