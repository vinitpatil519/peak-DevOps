{{- if .Values.secret.create }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "backend.fullname" . }}
  labels: {{- include "backend.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- required "secret.data must be set when secret.create=true" .Values.secret.data | toYaml | nindent 2 }}
{{- end }}
{{- if .Values.externalSecret.enabled }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.secret.existingSecret }}
  labels: {{- include "backend.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.externalSecret.refreshInterval }}
  secretStoreRef: {{- toYaml .Values.externalSecret.secretStoreRef | nindent 4 }}
  target:
    name: {{ .Values.secret.existingSecret }}
    creationPolicy: Owner
  data:
    - secretKey: CF_DB_PASSWORD
      remoteRef: { key: {{ .Values.externalSecret.remoteKey }}, property: db_password }
    - secretKey: CF_REDIS_PASSWORD
      remoteRef: { key: {{ .Values.externalSecret.remoteKey }}, property: redis_password }
{{- end }}
