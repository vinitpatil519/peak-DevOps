{{- if .Values.networkPolicy.enabled }}
# Namespace default-deny + DNS/istiod egress live in the platform chart; this adds the API's own paths.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "backend.fullname" . }}
  labels: {{- include "backend.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels: {{- include "backend.selectorLabels" . | nindent 6 }}
  policyTypes: [Ingress, Egress]
  ingress:
    - from: {{- toYaml .Values.networkPolicy.ingressFrom | nindent 8 }}
      ports:
        - { port: 8000, protocol: TCP }
    - from:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: {{ .Values.networkPolicy.monitoringNamespace }} }
      ports:
        - { port: 8000, protocol: TCP }
        - { port: 15020, protocol: TCP }   # Istio merged metrics
  egress:
    - to:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: {{ .Values.networkPolicy.databaseNamespace }} }
      ports:
        - { port: 5432, protocol: TCP }
        - { port: 6379, protocol: TCP }
{{- end }}
