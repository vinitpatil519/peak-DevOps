apiVersion: v1
kind: Pod
metadata:
  name: {{ include "backend.fullname" . }}-test
  labels: {{- include "backend.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: test
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
    sidecar.istio.io/inject: "false"
spec:
  restartPolicy: Never
  securityContext:
    runAsNonRoot: true
    runAsUser: 65534
    seccompProfile: { type: RuntimeDefault }
  containers:
    - name: curl
      image: curlimages/curl:8.16.0
      args: ["-fsS", "--retry", "5", "--retry-connrefused", "http://{{ include "backend.fullname" . }}:{{ .Values.service.port }}/healthz"]
      securityContext:
        allowPrivilegeEscalation: false
        capabilities: { drop: [ALL] }
