apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "redis.fullname" . }}
  labels: {{- include "redis.labels" . | nindent 4 }}
automountServiceAccountToken: false
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "redis.fullname" . }}
  labels: {{- include "redis.labels" . | nindent 4 }}
data:
  redis.conf: |
    bind 0.0.0.0
    port 6379
    protected-mode yes
    maxmemory {{ .Values.maxmemory }}
    maxmemory-policy {{ .Values.maxmemoryPolicy }}
    appendonly no
    {{- if not .Values.persistence.enabled }}
    save ""
    {{- end }}
    dir /data
    tcp-keepalive 60
    timeout 300
    # Disable dangerous commands for application clients.
    rename-command FLUSHALL ""
    rename-command FLUSHDB ""
    rename-command DEBUG ""
    # CONFIG stays enabled: redis_exporter reads maxmemory settings through CONFIG GET.
{{- if .Values.auth.createSecret }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "redis.fullname" . }}
  labels: {{- include "redis.labels" . | nindent 4 }}
type: Opaque
stringData:
  password: {{ required "auth.password required when auth.createSecret=true" .Values.auth.password | quote }}
{{- end }}
{{- if .Values.externalSecret.enabled }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.auth.existingSecret }}
  labels: {{- include "redis.labels" . | nindent 4 }}
spec:
  refreshInterval: 1h
  secretStoreRef: {{- toYaml .Values.externalSecret.secretStoreRef | nindent 4 }}
  target: { name: {{ .Values.auth.existingSecret }}, creationPolicy: Owner }
  data:
    - secretKey: password
      remoteRef: { key: {{ .Values.externalSecret.remoteKey }}, property: redis_password }
{{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "redis.fullname" . }}
  labels: {{- include "redis.labels" . | nindent 4 }}
spec:
  selector: {{- include "redis.selectorLabels" . | nindent 4 }}
  ports:
    - { name: tcp-redis, port: 6379, targetPort: redis, appProtocol: redis }
    {{- if .Values.exporter.enabled }}
    - { name: http-metrics, port: 9121, targetPort: metrics }
    {{- end }}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "redis.fullname" . }}
  labels: {{- include "redis.labels" . | nindent 4 }}
spec:
  serviceName: {{ include "redis.fullname" . }}
  replicas: 1
  selector:
    matchLabels: {{- include "redis.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels: {{- include "redis.labels" . | nindent 8 }}
      annotations:
        checksum/config: {{ printf "%s%s" .Values.maxmemory .Values.maxmemoryPolicy | sha256sum }}
        {{- if .Values.istio.enabled }}
        sidecar.istio.io/inject: "true"
        {{- end }}
    spec:
      serviceAccountName: {{ include "redis.fullname" . }}
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: redis
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["sh", "-c", "exec redis-server /etc/redis/redis.conf --requirepass \"$REDIS_PASSWORD\""]
          env:
            - name: REDIS_PASSWORD
              valueFrom: { secretKeyRef: { name: {{ include "redis.secret" . }}, key: password } }
            - { name: REDISCLI_AUTH, valueFrom: { secretKeyRef: { name: {{ include "redis.secret" . }}, key: password } } }
          ports:
            - { name: redis, containerPort: 6379, protocol: TCP }
          readinessProbe:
            exec: { command: ["sh", "-c", "redis-cli -h 127.0.0.1 ping | grep -q PONG"] }
            periodSeconds: 5
            timeoutSeconds: 2
          livenessProbe:
            tcpSocket: { port: redis }
            periodSeconds: 10
            failureThreshold: 3
          resources: {{ toYaml .Values.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          volumeMounts:
            - { name: config, mountPath: /etc/redis, readOnly: true }
            - { name: data, mountPath: /data }
        {{- if .Values.exporter.enabled }}
        - name: exporter
          image: {{ .Values.exporter.image }}
          env:
            - { name: REDIS_ADDR, value: "redis://127.0.0.1:6379" }
            - name: REDIS_PASSWORD
              valueFrom: { secretKeyRef: { name: {{ include "redis.secret" . }}, key: password } }
          ports:
            - { name: metrics, containerPort: 9121, protocol: TCP }
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits: { memory: 64Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities: { drop: [ALL] }
        {{- end }}
      volumes:
        - name: config
          configMap: { name: {{ include "redis.fullname" . }} }
        {{- if not .Values.persistence.enabled }}
        - { name: data, emptyDir: { sizeLimit: 256Mi } }
        {{- end }}
  {{- if .Values.persistence.enabled }}
  volumeClaimTemplates:
    - metadata: { name: data }
      spec:
        accessModes: [ReadWriteOnce]
        {{- if .Values.persistence.storageClass }}
        storageClassName: {{ .Values.persistence.storageClass }}
        {{- end }}
        resources: { requests: { storage: {{ .Values.persistence.size }} } }
  {{- end }}
{{- if .Values.pdb.enabled }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "redis.fullname" . }}
  labels: {{- include "redis.labels" . | nindent 4 }}
spec:
  maxUnavailable: {{ .Values.pdb.maxUnavailable }}
  selector:
    matchLabels: {{- include "redis.selectorLabels" . | nindent 6 }}
{{- end }}
{{- if .Values.networkPolicy.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "redis.fullname" . }}
  labels: {{- include "redis.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels: {{- include "redis.selectorLabels" . | nindent 6 }}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        {{- range .Values.networkPolicy.clientNamespaces }}
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: {{ . }} }
        {{- end }}
      ports: [{ port: 6379, protocol: TCP }]
    - from:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: {{ .Values.networkPolicy.monitoringNamespace }} }
      ports: [{ port: 9121, protocol: TCP }, { port: 15020, protocol: TCP }]
  egress: []
{{- end }}
{{- if .Values.istio.enabled }}
---
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: {{ include "redis.fullname" . }}
  labels: {{- include "redis.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels: {{- include "redis.selectorLabels" . | nindent 6 }}
  action: ALLOW
  rules:
    - from:
        - source:
            principals: {{- toYaml .Values.istio.allowedPrincipals | nindent 14 }}
      to:
        - operation: { ports: ["6379"] }
    - to:
        - operation: { ports: ["9121"] }
---
apiVersion: security.istio.io/v1
kind: PeerAuthentication
metadata:
  name: {{ include "redis.fullname" . }}-metrics
  labels: {{- include "redis.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels: {{- include "redis.selectorLabels" . | nindent 6 }}
  mtls: { mode: STRICT }
  portLevelMtls:
    "9121": { mode: PERMISSIVE }
{{- end }}
{{- if .Values.metrics.serviceMonitor.enabled }}
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "redis.fullname" . }}
  labels:
    {{- include "redis.labels" . | nindent 4 }}
    {{- toYaml .Values.metrics.serviceMonitor.labels | nindent 4 }}
spec:
  selector:
    matchLabels: {{- include "redis.selectorLabels" . | nindent 6 }}
  endpoints:
    - { port: http-metrics, interval: 30s }
{{- end }}
