# Local 3-tier stack: browser -> web (NGINX+React) -> apache-proxy -> api (FastAPI) -> postgres / redis
# Usage:  cp .env.example .env && docker compose up --build -d
#         open http://localhost:3000   (Grafana/Prometheus: docker compose --profile observability up -d)
name: cloudforge

x-logging: &default-logging
  driver: json-file
  options: { max-size: "10m", max-file: "3" }

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cloudforge}
      POSTGRES_USER: ${POSTGRES_USER:-cloudforge}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [data]
    logging: *default-logging

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}",
              "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru", "--appendonly", "no"]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" --no-auth-warning ping | grep PONG"]
      interval: 5s
      timeout: 3s
      retries: 10
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    networks: [data]
    logging: *default-logging

  api:
    build:
      context: ./app-backend
      args: { APP_VERSION: "${APP_VERSION:-local}" }
    image: cloudforge/api:${APP_VERSION:-local}
    restart: unless-stopped
    environment:
      CF_ENVIRONMENT: docker-compose
      CF_DB_HOST: postgres
      CF_DB_NAME: ${POSTGRES_DB:-cloudforge}
      CF_DB_USER: ${POSTGRES_USER:-cloudforge}
      CF_DB_PASSWORD: ${POSTGRES_PASSWORD}
      CF_REDIS_HOST: redis
      CF_REDIS_PASSWORD: ${REDIS_PASSWORD}
      CF_LOG_LEVEL: INFO
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    networks: [app, data]
    read_only: true
    tmpfs: [/tmp]
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    logging: *default-logging

  apache-proxy:
    build:
      context: ./apache-proxy
      args: { APP_VERSION: "${APP_VERSION:-local}" }
    image: cloudforge/apache-proxy:${APP_VERSION:-local}
    restart: unless-stopped
    environment:
      BACKEND_URL: http://api:8000
    depends_on:
      api: { condition: service_healthy }
    ports: ["8080:8080"]   # exposed for debugging the proxy tier directly
    networks: [edge, app]
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    logging: *default-logging

  web:
    build:
      context: ./app-frontend
      args: { APP_VERSION: "${APP_VERSION:-local}" }
    image: cloudforge/web:${APP_VERSION:-local}
    restart: unless-stopped
    environment:
      API_UPSTREAM_HOST: apache-proxy:8080
    depends_on:
      apache-proxy: { condition: service_healthy }
    ports: ["3000:8080"]
    networks: [edge]
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    logging: *default-logging

  # ---------- optional observability profile ----------
  prometheus:
    image: prom/prometheus:v3.6.0
    profiles: [observability]
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.retention.time=2d"]
    volumes:
      - ./monitoring/prometheus/prometheus-compose.yml:/etc/prometheus/prometheus.yml:ro
    ports: ["9090:9090"]
    networks: [app]

  grafana:
    image: grafana/grafana:12.2.0
    profiles: [observability]
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./helm-charts/charts/platform/files/dashboards:/var/lib/grafana/dashboards:ro
    ports: ["3001:3000"]
    networks: [app]

volumes:
  pgdata:

networks:
  edge: {}
  app: {}
  data:
    internal: true
