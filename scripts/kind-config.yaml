# kind cluster for CloudForge: 1 control-plane (ingress host ports) + 2 workers,
# containerd mirror to the local registry at localhost:5001 (see scripts/bootstrap-local.sh).
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: cloudforge
networking:
  # Keep kindnet: it enforces NetworkPolicy since kind v0.24.
  podSubnet: "10.244.0.0/16"
  serviceSubnet: "10.96.0.0/12"
containerdConfigPatches:
  - |-
    [plugins."io.containerd.grpc.v1.cri".registry]
      config_path = "/etc/containerd/certs.d"
nodes:
  - role: control-plane
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "ingress-ready=true"
    extraPortMappings:
      - { containerPort: 80, hostPort: 80, protocol: TCP }
      - { containerPort: 443, hostPort: 443, protocol: TCP }
  - role: worker
    labels: { cloudforge.dev/pool: apps }
  - role: worker
    labels: { cloudforge.dev/pool: apps }
