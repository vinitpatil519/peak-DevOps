provider:
  name: aws
env:
  - { name: AWS_DEFAULT_REGION, value: us-east-1 }
serviceAccount:
  create: true
  name: external-dns                   # Pod Identity association in terraform/modules/iam
sources: [ingress, service, istio-gateway]
domainFilters: [cloudforge.example.com]
policy: upsert-only
registry: txt
txtOwnerId: cloudforge-dev
interval: 1m
serviceMonitor:
  enabled: true
  additionalLabels: { release: kube-prometheus-stack }
