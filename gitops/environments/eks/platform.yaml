# EKS overrides for charts/platform
environment: dev
domain: cloudforge.example.com
istio:
  gateway:
    hosts: [mesh.cloudforge.example.com]
    tls:
      enabled: true
certManager:
  enabled: true
  solver: dns01
  route53:
    region: us-east-1
    hostedZoneID: Z0000000000000000000   # terraform output route53_zone_id
  certificate:
    enabled: true
    dnsNames: [mesh.cloudforge.example.com]
