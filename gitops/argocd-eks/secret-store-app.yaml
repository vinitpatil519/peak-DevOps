# ClusterSecretStore for External Secrets (EKS). Separate app so it syncs after the CRDs exist.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: secret-store-eks
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  project: cloudforge-platform
  source:
    repoURL: https://github.com/vinitpatil519/CloudForge.git
    targetRevision: main
    path: gitops/addons/external-secrets/store
  destination:
    server: https://kubernetes.default.svc
    namespace: external-secrets
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions: [SkipDryRunOnMissingResource=true]
