# Reverse proxy: /api/* -> FastAPI. Anything else is rejected (frontend serves its own assets).
<VirtualHost *:${LISTEN_PORT}>
    DocumentRoot "/usr/local/apache2/htdocs"

    # Propagate (or assign) a request id for end-to-end correlation NGINX -> Apache -> FastAPI.
    RequestHeader setifempty X-Request-ID "%{UNIQUE_ID}e"
    Header always set X-Request-ID "%{X-Request-ID}i"
    Header always set X-Served-By "apache-proxy"
    Header always unset X-Powered-By
    RequestHeader unset Proxy early

    # Static probe target used by Kubernetes liveness/readiness probes.
    <Directory "/usr/local/apache2/htdocs">
        Options None
        AllowOverride None
        <Files "apache-health">
            ForceType text/plain
            Require all granted
        </Files>
    </Directory>

    # Scraped by the apache-exporter sidecar over localhost only.
    <Location "/server-status">
        SetHandler server-status
        Require ip 127.0.0.1 ::1
    </Location>

    ProxyRequests Off
    ProxyPreserveHost On
    ProxyTimeout 30

    # Connection pool to FastAPI. The Kubernetes Service (+ Istio sidecar) load-balances and
    # upgrades the hop to mTLS, so Apache talks plain HTTP to its local Envoy.
    ProxyPass        "/api/" "${BACKEND_URL}/api/" connectiontimeout=3 timeout=30 retry=0 keepalive=On ttl=60
    ProxyPassReverse "/api/" "${BACKEND_URL}/api/"
    <Location "/api/">
        Require all granted
    </Location>
</VirtualHost>
