[project]
name = "cloudforge-api"
version = "1.0.0"
description = "CloudForge Platform backend API"
requires-python = ">=3.13"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "--cov=app --cov-report=xml:coverage.xml --cov-report=term --junitxml=test-results.xml"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101", "B008"]

[tool.coverage.run]
branch = true
source = ["app"]
